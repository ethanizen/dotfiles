// command aliases
alias "dc" "disconnect"

// quick-knife
alias +switchw "slot3"
alias -switchw "lastinv"
bind "mouse5" +switchw 

// viewmodel
viewmodel_fov 68
viewmodel_offset_x 2.5
viewmodel_offset_y 2
viewmodel_offset_z -2

// radar
cl_hud_radar_scale 1.15         // Maximizes overall radar size for easy reading
cl_radar_scale 0.50             // Zooms out the map to show flanks and rotations
cl_radar_always_centered 0      // Keeps player slightly off-center to see more area in front of you
cl_radar_rotate 1               // Rotates the radar with your player's view
cl_radar_icon_scale_min 1       // Prevents teammate icons from shrinking when zoomed out
cl_radar_square_with_scoreboard 1 // Displays a square radar for maximum map coverage when checking the board

// crosshair (ZywOo)
cl_crosshairgap "-2.2"
cl_crosshair_outlinethickness "1"
cl_crosshaircolor_r "255"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "255"
cl_crosshairalpha "255"
cl_crosshair_dynamic_splitdist "3"
cl_crosshair_recoil "false"
cl_fixedcrosshairgap "3"
cl_crosshaircolor "5"
cl_crosshair_drawoutline "false"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshairthickness "0.5"
cl_crosshairdot "false"
cl_crosshairgap_useweaponvalue "false"
cl_crosshairusealpha "true"
cl_crosshair_t "false"
cl_crosshairstyle "4"
cl_crosshairsize "1.5"
