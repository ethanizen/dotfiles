// ============================================================
//  practice.cfg  —  CS2 offline practice setup
//  Load with:  exec practice   (console, on a local server)
//  All of this is sv_cheats-gated and offline-only.
//  How to start: Play > Practice > pick a map > Go, then exec practice
// ============================================================

// ---------- Server / match rules ----------
sv_cheats 1
bot_kick                    // clear the default bots (re-add below if you want them)
mp_limitteams 0
mp_autoteambalance 0
mp_warmup_end
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_maxmoney 60000
mp_startmoney 60000
mp_buytime 9999
mp_buy_anywhere 1
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
god

// ---------- Stay alive through a lineup ----------
sv_infinite_ammo 1          // 1 = never reload. Set 2 if you'd rather drop/switch nade types.
sv_regeneration_force_on 1  // passive HP regen so you don't reset mid-session
// god / buddha are toggles — bound to keys below

// ---------- Grenades ----------
ammo_grenade_limit_total 5
sv_grenade_trajectory 1                  // colored flight-path line
sv_grenade_trajectory_time 10
sv_grenade_trajectory_prac_pipreview 1   // picture-in-picture "grenade cam" of the landing
sv_grenade_trajectory_prac_trailtime 10
sv_grenade_trajectory_time_spectator 10

// ---------- Bullet impacts (spray / wallbang practice) ----------
sv_showimpacts 1
sv_showimpacts_time 10

// ---------- Binds ----------
bind "n" "noclip"                                                      // fly toggle
bind "h" "sv_rethrow_last_grenade"                                     // replay last throw exactly
bind "j" "ent_fire *_projectile kill; ent_fire inferno kill; stopsound"// nuke active smokes/molly + kill the sound
bind "k" "bot_place"                                                   // drop a stationary bot at your crosshair
bind "l" "god"                                                         // toggle god mode (or swap for: buddha)

// ---------- Optional bot helpers (uncomment as needed) ----------
// bind "f1" "bot_add_t"
// bind "f2" "bot_add_ct"
// bind "f3" "bot_stop 1"      // freeze bots in place
// bind "f4" "bot_kick"

// ---------- Optional: kill new decals (flaky in CS2, test it) ----------
// r_csgo_render_decals false   // most reliable of the decal commands; toggle back with ...true

// ---------- Skip the match-start cinematic (must precede restart) ----------
mp_team_intro_time 0
cl_versus_intro 0

// ---------- Apply spawns/money cleanly ----------
mp_restartgame 1
echo "practice.cfg loaded"
